<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Kestrel could not load</title>
    <style>
      :root { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e9e9e4; background: #141513; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { width: min(520px, calc(100vw - 64px)); text-align: center; }
      .brand-logo { display: block; width: min(280px, 70vw); margin: 0 auto 28px; }
      h1 { margin: 0; font-size: 30px; font-weight: 560; letter-spacing: -.03em; }
      p { margin: 14px 0 28px; color: #969890; }
      button { min-height: 38px; margin: 0 4px; padding: 0 15px; border: 1px solid #3b3d39; border-radius: 7px; background: #1b1c1a; color: #e2e2dd; font: inherit; }
      button.primary { border-color: #92aa88; background: #92aa88; color: #111310; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img class="brand-logo" src="./kestrel-full-horz-dark-mode.png" alt="Kestrel" />
      <h1>Kestrel’s interface could not load.</h1>
      <p id="details">The installed renderer may be missing or damaged. Restart Kestrel. If this continues, open Diagnostics and reinstall or update the app.</p>
      <button class="primary" id="restart" type="button">Restart Kestrel</button>
      <button id="diagnostics" type="button">Open Diagnostics</button>
    </main>
    <script>
      "use strict";
      const desktopBridge = window.kestrelDesktop;
      const details = document.getElementById("details");
      const restart = document.getElementById("restart");
      let restartRequiresForce = false;

      restart.addEventListener("click", async () => {
        if (desktopBridge === undefined) {
          details.textContent = "Kestrel’s Desktop bridge is unavailable. Quit the app and open it again.";
          return;
        }
        restart.disabled = true;
        try {
          const result = await desktopBridge.restartKestrel({ force: restartRequiresForce });
          if (result.status === "blocked") {
            restartRequiresForce = result.forceAvailable;
            restart.textContent = restartRequiresForce
              ? "Force Restart Kestrel"
              : "Restart Kestrel";
            details.textContent = result.blockers
              .map((blocker) => blocker.message)
              .join("\n");
          }
        } catch (error) {
          details.textContent = error instanceof Error ? error.message : String(error);
        } finally {
          restart.disabled = false;
        }
      });
      document.getElementById("diagnostics").addEventListener("click", () => {
        void desktopBridge?.openDiagnostics();
      });
    </script>
  </body>
</html>
