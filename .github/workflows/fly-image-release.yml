name: Fly image release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild every managed Fly image
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: fly-image-release
  cancel-in-progress: true

jobs:
  publish-candidate:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KESTREL_RELEASE_PUBLISH_URL: ${{ vars.KESTREL_RELEASE_PUBLISH_URL }}
      KESTREL_RELEASE_TRIGGER: ${{ github.event_name == 'push' && 'main' || github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      KESTREL_RELEASE_FORCE_ALL: ${{ github.event_name == 'schedule' || inputs.force_all == true }}
      KESTREL_RELEASE_VALIDATION_COMMANDS: '["pnpm validate"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Validate the release revision
        run: pnpm validate
      - name: Authenticate Docker to the Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker
      - name: Wait for the exact Kestrel One production revision
        run: pnpm tsx scripts/wait-for-kestrel-production-revision.ts ${{ github.sha }}
      - name: Deploy or verify the release controller
        id: deploy-release-controller
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm tsx apps/web/scripts/deploy-control-worker-candidate.ts ${{ github.sha }}
      - name: Capture release controller failure evidence
        if: ${{ failure() && steps.deploy-release-controller.outcome == 'failure' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app kestrel-one-control-worker || true
          inventory="$(flyctl machine list --app kestrel-one-control-worker --json 2>/dev/null || printf '[]')"
          printf '%s\n' "$inventory" | jq '[.[] | {
            id: (.id // .ID),
            state: (.state // .State),
            region: (.region // .Region),
            standbys: (.config.standbys // .Config.Standbys // []),
            imageDigest: (.image_ref.digest // .ImageRef.Digest),
            imageRevision: (.image_ref.labels["org.opencontainers.image.revision"] // .ImageRef.Labels["org.opencontainers.image.revision"]),
            imageFingerprint: (.image_ref.labels["org.kestrel.control-worker.fingerprint"] // .ImageRef.Labels["org.kestrel.control-worker.fingerprint"])
          }]'
          printf '%s\n' "$inventory" | jq -r '.[] | (.id // .ID)' | while read -r machine_id; do
            flyctl machine status "$machine_id" --app kestrel-one-control-worker || true
          done
          flyctl logs --app kestrel-one-control-worker --no-tail 2>&1 | tail -n 200 || true
      - name: Build, smoke, and publish candidate images
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm release:fly-images
