name: Runtime deployment

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild every managed Fly image
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: fly-image-release
  cancel-in-progress: false

jobs:
  deploy-runtime:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KESTREL_PLATFORM_IMAGE_URL: ${{ vars.KESTREL_PLATFORM_IMAGE_URL }}
      KESTREL_RELEASE_TRIGGER: ${{ github.event_name == 'push' && 'main' || github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      KESTREL_RELEASE_FORCE_ALL: ${{ github.event_name == 'schedule' || inputs.force_all == true }}
      KESTREL_RELEASE_DIFF_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
      KESTREL_RELEASE_VALIDATION_COMMANDS: '["pnpm validate"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Validate the release revision
        run: pnpm validate
      - name: Verify the checked-in rollout contract
        run: pnpm tsx scripts/validate-runtime-rollout-contract.ts
      - name: Authenticate Docker to the Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker
      - name: Wait for the exact Kestrel One production revision
        run: pnpm tsx scripts/wait-for-kestrel-production-revision.ts ${{ github.sha }}
      - name: Build, smoke, deploy global apps, and publish desired platform images
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm release:fly-images
      - name: Verify the control worker is ready
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for attempt in $(seq 1 45); do
            if flyctl ssh console \
              --app kestrel-one-control-worker \
              --command "grep -q release-controller-v1 /tmp/kestrel-control-worker-ready"
            then
              exit 0
            fi
            sleep 2
          done
          echo "Control worker did not become ready within 90 seconds." >&2
          exit 1
