name: Fly image release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild every managed Fly image
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: fly-image-release
  cancel-in-progress: true

jobs:
  publish-candidate:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KESTREL_RELEASE_PUBLISH_URL: ${{ vars.KESTREL_RELEASE_PUBLISH_URL }}
      KESTREL_RELEASE_TRIGGER: ${{ github.event_name == 'push' && 'main' || github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      KESTREL_RELEASE_FORCE_ALL: ${{ github.event_name == 'schedule' || inputs.force_all == true }}
      KESTREL_RELEASE_VALIDATION_COMMANDS: '["pnpm validate"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Validate the release revision
        run: pnpm validate
      - name: Authenticate Docker to the Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker
      - name: Deploy the release controller
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy .
          --app kestrel-one-control-worker
          --config deploy/fly/kestrel-one-control-worker/fly.toml
          --dockerfile deploy/fly/kestrel-one-control-worker/Dockerfile
          --remote-only
          --build-arg KESTREL_GIT_SHA=${{ github.sha }}
      - name: Verify the release controller contract
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for attempt in $(seq 1 45); do
            if flyctl ssh console \
              --app kestrel-one-control-worker \
              --command "grep -q release-controller-v1 /tmp/kestrel-control-worker-ready"
            then
              exit 0
            fi
            sleep 2
          done
          echo "Release controller did not become ready within 90 seconds." >&2
          exit 1
      - name: Wait for the exact Kestrel One production revision
        run: pnpm tsx scripts/wait-for-kestrel-production-revision.ts ${{ github.sha }}
      - name: Build, smoke, and publish candidate images
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm release:fly-images
