name: Fly image release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild every managed Fly image
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: fly-image-release
  cancel-in-progress: false

jobs:
  publish-candidate:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KESTREL_RELEASE_PUBLISH_URL: ${{ vars.KESTREL_RELEASE_PUBLISH_URL }}
      KESTREL_RELEASE_TRIGGER: ${{ github.event_name == 'push' && 'main' || github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      KESTREL_RELEASE_FORCE_ALL: ${{ github.event_name == 'schedule' || inputs.force_all == true }}
      KESTREL_RELEASE_VALIDATION_COMMANDS: '["pnpm validate"]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.82
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
      - name: Validate the release revision
        run: pnpm validate
      - name: Ensure release-control database schema
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          KESTREL_RELEASE_DATABASE_TARGET_SHA256: ${{ vars.KESTREL_RELEASE_DATABASE_TARGET_SHA256 }}
        run: pnpm --dir apps/web db:migrate:release-control
      - name: Authenticate Docker to the Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker
      - name: Authenticate Docker to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Wait for the exact Kestrel One production revision
        run: pnpm tsx scripts/wait-for-kestrel-production-revision.ts ${{ github.sha }}
      - name: Preflight release publication
        run: pnpm tsx scripts/preflight-fly-image-publication.ts
      - name: Build, smoke, and publish the complete candidate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm release:fly-images
