name: Production RunPod worker

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      diff_base:
        description: Git revision to diff for manual recovery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-runpod-worker
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: images
        env:
          KESTREL_DIFF_BASE: ${{ github.event_name == 'push' && github.event.before || inputs.diff_base }}
        run: pnpm tsx scripts/select-production-images.ts runpod

  deploy:
    needs: select
    if: ${{ fromJSON(needs.select.outputs.matrix).role[0] != null }}
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.82
      - name: Authenticate Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker
      - name: Build, smoke, deploy, verify health, and roll back on failure
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm tsx scripts/deploy-production-image.ts runpod-worker
