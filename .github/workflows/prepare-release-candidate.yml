name: Prepare release candidate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: UUID of the v3 release candidate to prepare
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: fly-release-preparation
  cancel-in-progress: false

jobs:
  prepare-candidate:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KESTREL_RELEASE_PREPARE_URL: ${{ vars.KESTREL_RELEASE_PREPARE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.82
      - name: Validate the exact preparation revision
        run: pnpm validate
      - name: Wait for the exact Kestrel One production revision
        run: pnpm tsx scripts/wait-for-kestrel-production-revision.ts ${{ github.sha }}
      - name: Deploy and prove the exact controller candidate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: pnpm tsx apps/web/scripts/prepare-release-candidate.ts ${{ inputs.release_id }} ${{ github.sha }}
