name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run the local validation contract
        run: pnpm validate
      - name: Publish validation summary
        if: always()
        run: node scripts/summarize-validation-report.mjs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/validation/report.json
          if-no-files-found: ignore
          retention-days: 14
