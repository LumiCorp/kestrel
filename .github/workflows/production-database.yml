name: Production database

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply ordered production migrations
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.POSTGRES_URL_NON_POOLING }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Require the unpooled production connection
        run: test -n "$DATABASE_URL_UNPOOLED"
      - name: Apply the ordinary ordered migrator
        run: pnpm db:migrate:deploy
