# Fly deployment configuration for the public Preview Edge service.
app = "kestrel-preview-edge"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "apps/preview-edge/Dockerfile"

[env]
  PORT = "8080"
  HEALTH_PORT = "8081"
  KESTREL_PREVIEW_HOST_SUFFIX = "preview.kestrelagents.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[checks.preview_edge]
  type = "http"
  port = 8081
  method = "get"
  path = "/health"
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
