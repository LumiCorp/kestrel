app = "kestrel-one-control-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 35

[build]
  dockerfile = "Dockerfile"

[env]
  KESTREL_WORKER_HEALTH_PORT = "8081"

[processes]
  worker = "pnpm --filter @kestrel/kestrel-one worker:control"

[checks.worker]
  type = "http"
  port = 8081
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
