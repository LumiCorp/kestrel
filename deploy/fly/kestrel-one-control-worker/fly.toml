app = "kestrel-one-control-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 35

[build]
  dockerfile = "Dockerfile"

[env]
  KESTREL_CONTROL_WORKER_READY_FILE = "/tmp/kestrel-control-worker-ready"

[processes]
  worker = "pnpm --filter @kestrel/kestrel-one worker:control"

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
